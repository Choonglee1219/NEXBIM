<!doctype html>
<html lang="en" class="bim-ui-dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXBIM - Next Engineering eXpert for BIM</title>
  <link rel="stylesheet" href="./src/style.css">
  <script>
    if (typeof window !== "undefined") {
      if (typeof window.GPUShaderStage === "undefined") {
        window.GPUShaderStage = { VERTEX: 1, FRAGMENT: 2, COMPUTE: 4 };
      }
      if (typeof window.GPUBufferUsage === "undefined") {
        window.GPUBufferUsage = { MAP_READ: 1, MAP_WRITE: 2, COPY_SRC: 4, COPY_DST: 8, INDEX: 16, VERTEX: 32, UNIFORM: 64, STORAGE: 128, INDIRECT: 256, QUERY_RESOLVE: 512 };
      }
      if (typeof window.GPUTextureUsage === "undefined") {
        window.GPUTextureUsage = { COPY_SRC: 1, COPY_DST: 2, TEXTURE_BINDING: 4, STORAGE_BINDING: 8, RENDER_ATTACHMENT: 16 };
      }
      if (typeof window.GPUMapMode === "undefined") {
        window.GPUMapMode = { READ: 1, WRITE: 2 };
      }
    }
  </script>
</head>

<body>
  <bim-grid id="app"></bim-grid>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
